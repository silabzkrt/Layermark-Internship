version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: hrman-postgres
    environment:
      POSTGRES_DB: hrmandb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hrman-network

volumes:
  postgres_data:

networks:
  hrman-network:
    driver: bridge
